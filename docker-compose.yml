services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: urban-map-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-urban_map_bucaramanga}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: urban-map-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_ENABLED: "true"
      API_PORT: ${API_PORT:-3001}
      API_HOST: ${API_HOST:-0.0.0.0}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-urban_map_bucaramanga}
    depends_on:
      - postgres
    ports:
      - "3001:3001"
    volumes:
      - ./:/app
      - /app/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: urban-map-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001/api/v1}
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules

volumes:
  postgres_data:
